  <g stroke="#fff" stroke-width="2.8" stroke-linecap="round">
    <line x1="7" y1="9.5" x2="24.5" y2="9.5"/>
    <line x1="7" y1="14" x2="18.5" y2="14"/>
    <line x1="7" y1="18.5" x2="22" y2="18.5"/>
    <line x1="7" y1="23" x2="16" y2="23"/>
  </g>
</svg>
